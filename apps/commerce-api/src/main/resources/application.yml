server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

product-metric:
  topic: product.metric.v1

coupon:
  issue:
    topic: coupon.issue.v1

outbox:
  relay:
    interval-ms: 30000

waiting-queue:
  token:
    secret: ${WAITING_QUEUE_TOKEN_SECRET:loopers-local-waiting-queue-secret}
  admission:
    tick-ms: 1000

pg-simulator:
  url: ${PG_SIMULATOR_URL:http://localhost:8082}
  callback-url: ${PG_CALLBACK_URL:http://localhost:8080/api/v1/payments/callback}

resilience4j:
  retry:
    instances:
      pgPayment:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - feign.RetryableException
          - java.io.IOException
        fail-after-max-attempts: true
  circuitbreaker:
    instances:
      pgPayment:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 100            # 윈도우가 작으면(10) 실패율 추정 분산이 커져(σ≈15%) 정상 변동에도 회로가 깜빡인다. 100이면 σ≈5%로 안정
        minimum-number-of-calls: 50         # 표본이 적으면 한두 건으로 실패율이 출렁인다. 윈도우의 절반 이상 쌓인 뒤 판단
        failure-rate-threshold: 50          # 실패율 50% 초과 시 Open
        slow-call-rate-threshold: 50        # 느린 호출 비율 50% 초과 시 Open
        wait-duration-in-open-state: 10s    # Open 상태 유지 시간
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false